<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Student Management System{% endblock %}</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #66738e;
        --primary: #3159d9;
        --primary-soft: #edf3ff;
        --secondary: #5d7cfa;
        --dark: #15254f;
        --surface: rgba(255, 255, 255, 0.88);
        --surface-strong: #ffffff;
        --line: #e3e8f4;
        --danger: #d74a68;
        --success: #1a9d73;
        --shadow-soft: 0 14px 34px rgba(18, 35, 75, 0.09);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        position: relative;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(
            circle at top left,
            rgba(120, 146, 255, 0.18),
            transparent 28%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(54, 102, 255, 0.12),
            transparent 30%
          ),
          linear-gradient(135deg, #f4f7ff 0%, #f9fbff 38%, #eef6ff 100%);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(17, 24, 39, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(17, 24, 39, 0.02) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(
          circle at center,
          black 35%,
          transparent 100%
        );
      }
      .navbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px max(5vw, 24px);
        background: rgba(21, 37, 79, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 10px 26px rgba(21, 37, 79, 0.12);
      }
      .brand {
        color: #fff;
        font-size: 1.18rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .nav-links a {
        padding: 9px 12px;
        border: 1px solid transparent;
        border-radius: 10px;
        color: #dfe9ff;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.08);
        transform: translateY(-1px);
      }
      .container {
        width: min(1180px, 90%);
        margin: 44px auto;
      }
      .narrow {
        width: min(760px, 90%);
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 2.8rem);
        line-height: 1.12;
      }
      h2 {
        margin-top: 0;
      }
      ::selection {
        background: rgba(49, 89, 217, 0.2);
      }
      .subtitle,
      .lead {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
      .page-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 28px;
      }
      .card,
      .panel,
      .content-card {
        padding: 28px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow-soft);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card:hover,
      .panel:hover,
      .content-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 38px rgba(18, 35, 75, 0.12);
      }
      .button,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 10px 16px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), #4b6ef5);
        box-shadow: 0 12px 22px rgba(49, 89, 217, 0.22);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          opacity 0.18s ease;
      }
      .button:hover,
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(49, 89, 217, 0.24);
      }
      .secondary {
        color: var(--ink);
        background: #edf1fb;
        box-shadow: none;
      }
      .danger {
        background: linear-gradient(135deg, #eb4f68, #c9344c);
      }
      .actions,
      .form-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .back,
      .back-link {
        display: inline-block;
        margin-bottom: 18px;
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
      }
      form p {
        margin: 0 0 16px;
      }
      label {
        display: block;
        margin-bottom: 7px;
        font-weight: 700;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #d5ddea;
        border-radius: 10px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.8);
        font: inherit;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: rgba(49, 89, 217, 0.5);
        box-shadow: 0 0 0 4px rgba(49, 89, 217, 0.1);
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        padding: 14px;
        color: var(--muted);
        background: #f8faff;
        font-size: 0.78rem;
        text-align: left;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      td {
        padding: 14px;
        border-top: 1px solid var(--line);
      }
      tbody tr {
        transition: background 0.18s ease;
      }
      tbody tr:hover {
        background: #f9fbff;
      }
      td a {
        color: var(--primary);
        font-weight: 650;
        text-decoration: none;
      }
      .empty {
        padding: 36px;
        text-align: center;
        color: var(--muted);
      }
      .details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .details div {
        padding: 16px 14px;
        border-radius: 12px;
        background: linear-gradient(180deg, #f8faff, #f2f6ff);
        border: 1px solid rgba(49, 89, 217, 0.06);
      }
      .details dd {
        margin: 6px 0 0;
      }
      .dashboard-columns {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 26px;
        margin-top: 26px;
      }
      @media (max-width: 700px) {
        .navbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .container,
        .narrow {
          width: calc(100% - 32px);
          margin-top: 32px;
        }
        .page-header {
          align-items: flex-start;
          flex-direction: column;
        }
        .details {
          grid-template-columns: 1fr;
        }
        .dashboard-columns {
          grid-template-columns: 1fr;
        }
        .card,
        .panel,
        .content-card {
          padding: 22px;
        }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="{% url 'dashboard' %}">ClassFlow</a>
      <div class="nav-links">
        <a
          class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
          href="{% url 'dashboard' %}"
          >Dashboard</a
        >
        <a
          class="{% if 'student' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'student_list' %}"
          >Students</a
        >
        <a
          class="{% if 'teacher' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'teacher_list' %}"
          >Teachers</a
        >
        <a
          class="{% if 'course' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'course_list' %}"
          >Courses</a
        >
        <a
          class="{% if 'subject' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'subject_list' %}"
          >Subjects</a
        >
        <a
          class="{% if 'result' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'result_list' %}"
          >Results
        </a>
        <a
          class="{% if 'attendance' in request.resolver_match.url_name %}active{% endif %}"
          href="{% url 'attendance_list' %}"
          >Attendance</a
        >
        <a
          class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}"
          href="{% url 'profile' %}"
          >Profile</a
        >
      </div>
    </nav>
    {% block content %}{% endblock %}
  </body>
</html>
