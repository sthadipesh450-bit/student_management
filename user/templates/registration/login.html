{% load static %} <!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <link rel="stylesheet" href="{% static 'user/css/auth.css' %}" />
  </head>
  <body>
    <main class="auth-card">
      <a class="brand" href="{% url 'dashboard' %}">Student Management</a>
      <h1>Welcome back</h1>
      <p class="intro">Sign in to access your dashboard.</p>
      {% if form.errors %}
      <p class="errorlist">
        Your username or password was incorrect. Please try again.
      </p>
      {% endif %}
      <form class="auth-form" method="post">
        {% csrf_token %}{{ form.as_p }}<input
          type="hidden"
          name="next"
          value="{{ next }}"
        /><button class="button" type="submit">Sign in</button>
      </form>
      <p class="footer">
        New here? <a href="{% url 'register' %}">Create an account</a>
      </p>
    </main>
  </body>
</html>
