{% load static %} <!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account</title>
    <link rel="stylesheet" href="{% static 'user/css/auth.css' %}" />
  </head>
  <body>
    <main class="auth-card">
      <a class="brand" href="{% url 'dashboard' %}">Student Management</a>
      <h1>Create account</h1>
      <p class="intro">Create your account to get started.</p>
      <form class="auth-form" method="post">
        {% csrf_token %}{{ form.as_p }}<button class="button" type="submit">
          Create account
        </button>
      </form>
      <p class="footer">
        Already have an account? <a href="{% url 'login' %}">Sign in</a>
      </p>
    </main>
  </body>
</html>
