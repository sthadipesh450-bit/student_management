<!DOCTYPE html>
<html>
<head>
    <title>Delete Subject</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            width: 450px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        .delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel {
            background: #6c757d;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Delete Subject</h2>

    <p>
        Are you sure you want to delete
        <strong>{{ subject.subject_name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="delete">
            Yes, Delete
        </button>

        <a href="{% url 'subject_list' %}" class="cancel">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
