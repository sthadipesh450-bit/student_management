{% extends "base.html" %}
{% block title %}Delete Subject{% endblock %}
{% block content %}
<main class="container narrow"><section class="card"><h1>Delete {{ subject.subject_name }}?</h1><p class="subtitle">Courses will remain, but they will no longer be linked to this subject.</p><form method="post">{% csrf_token %}<div class="actions"><a class="button secondary" href="{% url 'subject_detail' subject.pk %}">Cancel</a><button class="danger" type="submit">Delete Subject</button></div></form></section></main>
{% endblock %}
