{% extends "base.html" %}{% block title %}Course Form{% endblock %}{% block
content %}
<main class="container narrow">
  <a class="back" href="{% url 'course_list' %}">← Back to courses</a>
  <section class="card">
    <h1>{% if object %}Edit Course{% else %}Add Course{% endif %}</h1>
    <form method="post">
      {% csrf_token %}{{ form.as_p }}
      <div class="actions">
        <a class="button secondary" href="{% url 'course_list' %}">Cancel</a
        ><button type="submit">Save Course</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
