{% extends "base.html" %}{% load static %}{% block title %}Delete Course
{% endblock %}{% block extra_head %}<link
  rel="stylesheet"
  href="{% static 'courses/css/courses.css' %}"
/>{% endblock %}{% block content %}
<main class="container narrow course-subpage">
  <section class="card course-card delete-card">
    <span class="warning-mark" aria-hidden="true">!</span>
    <p class="eyebrow">Remove from catalog</p>
    <h1>Delete {{ course.course_name }}?</h1>
    <p class="subtitle">This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <div class="actions">
        <a class="button secondary" href="{% url 'course_detail' course.pk %}"
          >Cancel</a
        ><button class="danger" type="submit">Delete Course</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
