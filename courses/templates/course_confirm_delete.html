{% extends "base.html" %}{% block title %}Delete Course{% endblock %}{% block
content %}
<main class="container narrow">
  <section class="card">
    <h1>Delete {{ course.course_name }}?</h1>
    <p class="subtitle">This action cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <div class="actions">
        <a class="button secondary" href="{% url 'course_detail' course.pk %}"
          >Cancel</a
        ><button class="danger" type="submit">Delete Course</button>
      </div>
    </form>
  </section>
</main>
{% endblock %}
