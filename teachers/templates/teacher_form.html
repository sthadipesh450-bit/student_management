<!DOCTYPE html>
<html>

<head>

    <title>
        {% if object %}
            Update Teacher
        {% else %}
            Add Teacher
        {% endif %}
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        .navbar {
            background-color: #2c3e50;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .form-card {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .form-card h1 {
            color: #2c3e50;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .buttons {
            margin-top: 25px;
        }

        .save-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-button:hover {
            background-color: #2980b9;
        }

        .back-button {
            background-color: #777;
            color: white;
            padding: 12px 22px;
            border-radius: 5px;
            text-decoration: none;
            margin-left: 10px;
        }

        .back-button:hover {
            background-color: #555;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <h2>Student Management System</h2>

        <div>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'teacher_list' %}">Teachers</a>
        </div>

    </nav>

    <div class="container">

        <div class="form-card">

            {% if object %}
                <h1>Update Teacher</h1>
            {% else %}
                <h1>Add New Teacher</h1>
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="buttons">

                    <button type="submit" class="save-button">
                        {% if object %}
                            Update Teacher
                        {% else %}
                            Add Teacher
                        {% endif %}
                    </button>

                    <a
                        href="{% url 'teacher_list' %}"
                        class="back-button"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
