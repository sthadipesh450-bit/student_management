<!DOCTYPE html>
<html>

<head>
    <title>Delete Student</title>
    <style>
        body { margin: 0; padding: 40px 20px; background: #fef2f2; color: #1f2937; font-family: Arial, sans-serif; }
        .container { max-width: 520px; margin: auto; padding: 32px; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
        h1 { margin-top: 0; color: #b91c1c; }
        button { padding: 10px 18px; border: 0; border-radius: 6px; background: #dc2626; color: #fff; font: inherit; font-weight: bold; cursor: pointer; }
        .cancel { display: inline-block; margin-top: 20px; color: #2563eb; text-decoration: none; }
    </style>
</head>

<body>
<main class="container">

    <h1>Delete Student</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ object.name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>

    <br>

    <a class="cancel" href="{% url 'student_list' %}">
        Cancel
    </a>

</main>
</body>

</html>
