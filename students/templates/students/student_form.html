<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 40px 20px; background: #f4f7fb; color: #1f2937; font-family: Arial, sans-serif; }
        .container { max-width: 650px; margin: auto; padding: 32px; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
        h1 { margin-top: 0; color: #1e3a8a; }
        form p { margin: 16px 0; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
        textarea { min-height: 90px; resize: vertical; }
        button { padding: 10px 18px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; font-weight: bold; cursor: pointer; }
        .back { display: inline-block; margin-top: 22px; color: #2563eb; text-decoration: none; }
    </style>
</head>

<body>
<main class="container">

    {% if object %}
        <h1>Update Student</h1>
    {% else %}
        <h1>Add Student</h1>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Student
        </button>

    </form>

    <br>

    <a class="back" href="{% url 'student_list' %}">
        Back to Student List
    </a>

</main>
</body>
</html>
